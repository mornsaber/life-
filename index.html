<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>LIFE//SIM</title>
    <meta name="description" content="A deep, text-based life simulator: careers, military service, emergency reserves, health, investing, campus life and more." />
    <!-- Installable app: add to your home screen and it opens full-screen. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0b0e1f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LifeSim" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <noscript>LIFE//SIM needs JavaScript enabled.</noscript>
    <script type="module" src="src/index.js"></script>
    <script>
      if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
    </script>
  </body>
</html>
